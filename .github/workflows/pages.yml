name: Refresh data and publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Collect public observations without exposing credentials
        run: node scripts/collect.mjs
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          HRFCO_API_KEY: ${{ secrets.HRFCO_API_KEY }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
